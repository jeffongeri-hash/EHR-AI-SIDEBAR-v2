# Fine-tuning config: Llama 3.2-3B on EHR domain data
# GPU requirement: ~8GB VRAM (RTX 3060 or better)
# Run: python fine_tuning/train.py --config fine_tuning/configs/llama3_ehr.yaml

base_model: "meta-llama/Llama-3.2-3B-Instruct"
output_name: "ehr-llama-3b-v1"
output_dir: "./models"

# Dataset: either a local JSONL or HuggingFace dataset name
# dataset: "datasets/ehr_train.jsonl"
dataset: "medalpaca/medical_meadow_medqa"
dataset_split: "train"
text_field: "text"

# Training hyperparameters
num_epochs: 3
batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.0002
warmup_steps: 100
max_seq_length: 2048
logging_steps: 10
save_strategy: "epoch"

# LoRA config (PEFT)
use_lora: true
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
  bias: none

# Quantization
load_in_4bit: true
bnb_compute_dtype: "float16"

# Hardware
fp16: true
gradient_checkpointing: true
dataloader_num_workers: 0

# HuggingFace Hub (optional)
push_to_hub: false
# hf_repo_id: "your-username/ehr-llama-3b"
# hf_token: ""  # or set HF_TOKEN env var
